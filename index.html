<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Finanzas Casa</title>
<style>
:root{
  --bg:#f4f6f5;--card:#fff;--tx:#14201d;--mu:#66736f;--ln:#e3e8e6;
  --pri:#0f766e;--pri2:#ccfbf1;--gas:#dc2626;--ing:#16a34a;--aho:#2563eb;--warn:#d97706;
  --and:#c026d3;--wil:#0284c7;--com:#64748b;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1513;--card:#17211e;--tx:#e8efed;--mu:#93a39e;--ln:#26332f;--pri:#2dd4bf;--pri2:#123a35;
  --gas:#f87171;--ing:#4ade80;--aho:#60a5fa;--warn:#fbbf24;--and:#e879f9;--wil:#38bdf8;--com:#94a3b8;}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.top{background:#0b3b36}}
.top h1{margin:0;font-size:19px}
.icon-btn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:12px;height:40px;min-width:40px;
  font-size:18px;margin-left:6px;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 10px}
.dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;display:inline-block}
.dot.ok{background:#4ade80}.dot.pend{background:#fbbf24}.dot.run{background:#fff;animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
main{padding:12px 12px 110px;max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;border:1px solid var(--ln)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--mu)}.small{font-size:12.5px}.big{font-size:28px;font-weight:700;letter-spacing:-.5px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--bg);border-radius:12px;padding:10px}
.stat b{display:block;font-size:15px;margin-top:2px}
.ing{color:var(--ing)}.gas{color:var(--gas)}.aho{color:var(--aho)}.warn{color:var(--warn)}
.cyc{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--ln);
  border-radius:14px;padding:6px;margin-bottom:12px}
.cyc button{border:0;background:var(--bg);border-radius:10px;width:40px;height:36px;font-size:18px}
.cyc span{font-weight:600}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;margin:5px 0 2px}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--pri)}
.brow{margin-bottom:10px}.brow .l{display:flex;justify-content:space-between;gap:8px;font-size:13.5px}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--ln)}
.list .it:last-child{border-bottom:0}
.ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px;background:var(--bg)}
.it .mid{flex:1;min-width:0}.it .mid div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.it .amt{font-weight:600;white-space:nowrap;text-align:right}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;color:#fff;margin-right:4px;vertical-align:middle}
.c-Andrea{background:var(--and)}.c-William{background:var(--wil)}.c-Compartido{background:var(--com)}
.day{font-size:12px;color:var(--mu);margin:12px 4px 2px;font-weight:600;text-transform:capitalize}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--ln);background:var(--card);border-radius:20px;padding:7px 12px;font-size:13.5px}
.chips button.on{background:var(--pri);border-color:var(--pri);color:#fff}
@media (prefers-color-scheme:dark){.chips button.on{color:#06201d}}
#fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:18px;border:0;
  background:var(--pri);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
@media (prefers-color-scheme:dark){#fab{color:#06201d}}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);
  padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{flex:1;border:0;background:none;padding:8px 0 7px;font-size:19px;display:flex;flex-direction:column;align-items:center;opacity:.55}
.tabs button span{font-size:10.5px;margin-top:1px}.tabs button.on{opacity:1;color:var(--pri)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet-card{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
label{display:block;font-size:12.5px;color:var(--mu);margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:12px;background:var(--bg)}
input.money{font-size:26px;font-weight:700;text-align:center}
.btns{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:600;background:var(--bg);border:1px solid var(--ln)}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
@media (prefers-color-scheme:dark){.btn.pri{color:#06201d}}
.btn.del{color:var(--gas)}
.btn.sm{flex:none;padding:8px 12px;font-size:13px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;
  padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;z-index:30;max-width:90%;text-align:center;font-size:14px}
.toast.show{opacity:1;transform:translateX(-50%)}
.alert{padding:10px 12px;border-radius:12px;margin-bottom:8px;font-size:13.5px;background:var(--bg);border-left:4px solid var(--warn)}
.alert.bad{border-color:var(--gas)}.alert.good{border-color:var(--ing)}
.pie{width:110px;height:110px;border-radius:50%;flex:none}
.legend div{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.vbars{display:flex;align-items:flex-end;gap:8px;height:140px;padding-top:6px}
.vbars .g{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.vbars .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.vbars .pair i{width:40%;border-radius:4px 4px 0 0;min-height:2px}
.vbars small{font-size:10.5px;color:var(--mu);margin-top:4px}
.erow{display:grid;gap:6px;grid-template-columns:2fr 1fr 1fr 40px;align-items:center;margin-bottom:6px}
.erow input,.erow select{padding:8px;font-size:13.5px}
.x{border:0;background:var(--bg);border-radius:10px;height:36px;color:var(--gas)}
.empty{text-align:center;color:var(--mu);padding:26px 10px}
.row{display:flex;align-items:center;gap:8px}
.sp{justify-content:space-between}
hr{border:0;border-top:1px solid var(--ln);margin:12px 0}
.quick input{font-size:15px}
.mic{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);font-size:20px}
.mic.on{background:var(--gas);color:#fff;animation:p 1s infinite}
.qprev .it{cursor:pointer}.qprev .warnx{color:var(--warn);font-size:12px}
.ins{font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--ln)}.ins:last-child{border-bottom:0}
.fx{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--ln)}.fx:last-child{border-bottom:0}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px}.chk input{width:20px;height:20px}
.rrow{background:var(--bg);border-radius:12px;padding:8px;margin-bottom:8px}
.rrow .g{display:grid;grid-template-columns:2fr 1.2fr .7fr 36px;gap:6px;align-items:center}
.rrow input{padding:8px;font-size:13.5px;background:var(--card)}
</style>
</head>
<body>
<header class="top">
  <div><h1 id="title">Inicio</h1></div>
  <div class="row">
    <button id="syncBtn" class="icon-btn" aria-label="Sincronizar"><span id="syncDot" class="dot"></span>⟳</button>
    <button id="cfgBtn" class="icon-btn" aria-label="Ajustes">⚙</button>
  </div>
</header>
<main id="view"></main>
<button id="fab" aria-label="Agregar movimiento">+</button>
<nav class="tabs">
  <button data-tab="inicio">🏠<span>Inicio</span></button>
  <button data-tab="movs">📋<span>Movimientos</span></button>
  <button data-tab="resumen">📊<span>Resumen</span></button>
  <button data-tab="tarjetas">💳<span>Tarjetas</span></button>
  <button data-tab="ahorro">🐷<span>Ahorro</span></button>
  <button data-tab="nemesis" id="tabNem">🏘️<span>Némesis</span></button>
</nav>
<div id="sheet" class="sheet hidden"><div class="sheet-card" id="sheetBody"></div></div>
<div id="toast" class="toast"></div>

<script>
'use strict';
/* ================== Almacenamiento local ================== */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){setTimeout(()=>toast('⚠️ El almacenamiento del celular está lleno: sincroniza y exporta una copia'),0)}}};

const REEMB_DEF='Reembolso de servicios';
const DEF_RECIBOS=[{id:'r-ene',nombre:'Energía',icono:'⚡',calc:'energia',resp:'Clímaco',frec:1,unidad:'kWh'},
 {id:'r-ag1',nombre:'Agua piso 1',icono:'💧',calc:'total',resp:'Clímaco',frec:1,unidad:'m³'},
 {id:'r-ag2',nombre:'Agua piso 2',icono:'💧',calc:'total',resp:'',frec:1,unidad:'m³'},
 {id:'r-gas',nombre:'Gas',icono:'🔥',calc:'total',resp:'',frec:1,unidad:'m³'},
 {id:'r-pre',nombre:'Impuesto predial',icono:'🏛️',calc:'total',resp:'',frec:12,unidad:''}];
const DEFAULT_CONFIG={
  updatedAt:0,
  corteCiclo:25,
  arriendoMensual:0,
  personas:['Andrea','William','Compartido'],
  categoriasGasto:['Mercado','Servicios públicos','Internet y celular','Administración y parqueadero','Créditos vivienda',
    'Transporte','Hijos','Educación','Salud','Personal','Salidas y ocio','Hogar y mejoras','Mantenimiento arriendo',
    'Diario (efectivo)','Seguros','Otros'],
  categoriasIngreso:['Salario','Arriendo','Otros ingresos'],
  mediosBase:['Efectivo','Débito','Transferencia / PSE'],
  tarjetas:[], // {nombre,titular,corte,pago,meta}
  presupuestos:{}, // categoria -> tope mensual
  fondos:[{nombre:'Fondo de emergencia',meta:0}],
  recurrentes:[], // {id,nombre,tipo,monto,persona,categoria,medio,fondo,dia,caja}
  nemesis:{nombre:'Casa en arriendo',arriendo:0,dia:5,inicio:'',saldoInicial:0,porCobrarInicial:0,inquilinos:[],ipc:{2026:5.1},
    categoriasGasto:['Servicios públicos','Reparaciones y mantenimiento','Impuesto predial','Otros impuestos y seguros','Otros'],
    categoriasIngreso:['Arriendo',REEMB_DEF,'Otros ingresos']}
};

let movs=LS.get('movs',[]);
let pending=LS.get('pending',[]);
let config=Object.assign({},DEFAULT_CONFIG,LS.get('config',{}));
let configDirty=LS.get('configDirty',false);
let local=Object.assign({url:'',token:'',yo:'William',lastSync:0},LS.get('local',{}));
let nemSec='general',tab='inicio',cycleOff=0,filt={persona:'',tipo:'',q:''};

function migrar(){let ch=false;const N=config.nemesis;
  if(!N||N.activo===undefined){config.nemesis={...DEFAULT_CONFIG.nemesis,...(N||{})};
    if(+config.arriendoMensual&&!config.nemesis.arriendo){config.nemesis={...config.nemesis,activo:true,arriendo:+config.arriendoMensual,nombre:/n[eé]mesis/i.test(JSON.stringify(config.categoriasIngreso))?'Casa Némesis':'Casa en arriendo',inicio:iso(today()).slice(0,7)}}
    ch=true}
  if(!Array.isArray(config.nemesis.inquilinos)||(!config.nemesis.inquilinos.length&&+config.nemesis.arriendo&&!config.nemesis.inqMig)){config.nemesis.inquilinos=[];config.nemesis.inqMig=true;
    if(+config.nemesis.arriendo)config.nemesis.inquilinos.push({id:'inq1',nombre:'Inquilino 1',unidad:'',arriendo:+config.nemesis.arriendo,dia:+config.nemesis.dia||5,contrato:'',
      servicios:'reembolsa',cobrarDesde:config.nemesis.inicio||iso(today()).slice(0,7),atrasoInicial:+config.nemesis.porCobrarInicial||0,activo:true,cambios:[]});ch=true}
  if(!config.nemesis.ipc){config.nemesis.ipc={2026:5.1};ch=true}
  if(!Array.isArray(config.nemesis.recibos)){config.nemesis.recibos=DEF_RECIBOS.map(r=>({...r}));ch=true}
  const NG=config.nemesis.categoriasGasto||(config.nemesis.categoriasGasto=[]);
  for(const r of config.nemesis.recibos.slice().reverse())if(!NG.includes(r.nombre)){NG.unshift(r.nombre);ch=true}
  if(!config.categoriasIngreso.some(c=>/miguel/i.test(c))){config.categoriasIngreso.splice(1,0,'Arriendo Miguel');ch=true}
  const NI=config.nemesis.categoriasIngreso||(config.nemesis.categoriasIngreso=['Arriendo','Otros ingresos']);
  if(!NI.includes(REEMB_DEF)){NI.splice(1,0,REEMB_DEF);ch=true}
  if(config.nemesis.activo&&!config.fondos.some(f=>f.caja==='nemesis')){config.fondos.push({nombre:'Predial '+(config.nemesis.nombre||'casa').replace(/^Casa\s+/i,''),meta:0,caja:'nemesis'});ch=true}
  const r0=(config.recurrentes||[]).length;config.recurrentes=(config.recurrentes||[]).filter(r=>r.id!=='rec-arriendo');if(config.recurrentes.length!==r0)ch=true;
  if(ch&&local.lastSync)touchConfig();return ch}
function persist(){LS.set('movs',movs);LS.set('pending',pending);LS.set('config',config);LS.set('configDirty',configDirty);LS.set('local',local)}

/* ================== Utilidades ================== */
const $=s=>document.querySelector(s);
const js=v=>esc(JSON.stringify(v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=new Intl.NumberFormat('es-CO',{maximumFractionDigits:0});
const money=n=>'$'+fmtN.format(Math.round(+n||0));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const dayIn=(y,m,day)=>{const f=new Date(y,m,1);return new Date(f.getFullYear(),f.getMonth(),Math.min(day,dim(f.getFullYear(),f.getMonth())))};
const days=(a,b)=>Math.round((b-a)/864e5);
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtD=d=>d.getDate()+' '+MES[d.getMonth()];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const active=()=>movs.filter(m=>!m.borrado);
const TIPOS={gasto:{n:'Gasto',i:'🧾',c:'gas',s:-1},ingreso:{n:'Ingreso',i:'💰',c:'ing',s:1},
  ahorro:{n:'Ahorro',i:'🐷',c:'aho',s:-1},retiro:{n:'Retiro ahorro',i:'↩️',c:'aho',s:1},pago_tc:{n:'Pago tarjeta',i:'💳',c:'muted',s:-1},
  prestamo:{n:'Préstamo',i:'🤝',c:'warn',s:-1},abono:{n:'Abono préstamo',i:'🔙',c:'ing',s:1},traslado:{n:'Traslado',i:'🔄',c:'muted',s:0}};
const isN=m=>m.caja==='nemesis';
const INQ='Inquilino (servicios)',REEMB='Reembolso de servicios';
const RECS=()=>((config.nemesis&&config.nemesis.recibos)||[]);
const esServ=c=>/servicio|energ|agua|gas\b|luz/i.test(nz(c||''))||RECS().some(r=>r.nombre===c&&!/impuesto|predial/i.test(nz(r.nombre)));
const esArr=c=>/arriendo/i.test(c||'');
const esReemb=m=>isN(m)&&((m.tipo==='gasto'&&!!m.tercero&&esServ(m.categoria))||(m.tipo==='ingreso'&&m.categoria===REEMB));
const INQS=()=>((config.nemesis&&config.nemesis.inquilinos)||[]);
const INQA=()=>INQS().filter(q=>q.activo!==false);
const NEM=()=>!!(config.nemesis&&config.nemesis.activo);
const NN=()=>(config.nemesis&&config.nemesis.nombre)||'Casa en arriendo';
const hogarAct=()=>active().filter(m=>!isN(m));
const nemAct=()=>active().filter(isN);
function catsFor(tipo,caja){const N=config.nemesis||{};if(caja==='nemesis')return tipo==='ingreso'?(N.categoriasIngreso||['Arriendo']):(N.categoriasGasto||['Otros']);
  return tipo==='ingreso'?config.categoriasIngreso:config.categoriasGasto}
const fondosFor=caja=>config.fondos.filter(f=>(f.caja||'hogar')===(caja||'hogar'));
const terceros=()=>[...new Set(active().filter(m=>m.tercero&&m.tercero!==INQ).map(m=>m.tercero))].sort();
const PCOL={Andrea:'var(--and)',William:'var(--wil)',Compartido:'var(--com)'};
const PAL=['#0f766e','#2563eb','#d97706','#c026d3','#dc2626','#16a34a','#7c3aed','#0891b2','#ea580c','#64748b','#db2777','#65a30d'];

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}
function medios(){return[...config.mediosBase,...config.tarjetas.map(t=>t.nombre)]}
function esTarjeta(n){return config.tarjetas.some(t=>t.nombre===n)}

/* ================== Ciclos (26 → 25) ================== */
function cycleAt(off){
  const C=+config.corteCiclo||25,t=today();
  let y=t.getFullYear(),m=t.getMonth();
  if(t.getDate()<=C)m-=1;
  const e=dayIn(y,m+off+1,C),pe=dayIn(y,m+off,C),s=new Date(pe.getFullYear(),pe.getMonth(),pe.getDate()+1);
  return{s,e,si:iso(s),ei:iso(e),label:fmtD(s)+' – '+fmtD(e)+' '+e.getFullYear()};
}
const inCycle=(c,list=hogarAct())=>list.filter(m=>m.fecha>=c.si&&m.fecha<=c.ei);
function totals(list){
  const t={ing:0,gas:0,aho:0,ret:0,pago:0,pre:0,abo:0,per:{},cat:{}};
  for(const m of list){const v=+m.monto||0;
    if(m.tipo==='gasto'){t.gas+=v;t.per[m.persona]=(t.per[m.persona]||0)+v;t.cat[m.categoria]=(t.cat[m.categoria]||0)+v}
    else if(m.tipo==='ingreso')t.ing+=v;else if(m.tipo==='ahorro')t.aho+=v;else if(m.tipo==='retiro')t.ret+=v;else if(m.tipo==='pago_tc')t.pago+=v;
    else if(m.tipo==='prestamo')t.pre+=v;else if(m.tipo==='abono')t.abo+=v}
  t.ahorroNeto=t.aho-t.ret;t.disp=t.ing-t.gas-t.ahorroNeto-(t.pre-t.abo);return t;
}
function cycleBar(){const c=cycleAt(cycleOff);
  return`<div class="cyc"><button onclick="cyc(-1)" aria-label="Ciclo anterior">‹</button><div style="text-align:center"><span>${c.label}</span>
  <div class="small muted">${cycleOff===0?'Ciclo actual':cycleOff<0?'Ciclo anterior':'Ciclo futuro'}</div></div>
  <button onclick="cyc(1)" aria-label="Ciclo siguiente">›</button></div>`}
function cyc(d){cycleOff+=d;render()}

/* ================== Tarjetas: fechas ================== */
function nextDay(day){const t=today();let d=dayIn(t.getFullYear(),t.getMonth(),day);if(d<t)d=dayIn(t.getFullYear(),t.getMonth()+1,day);return d}
function corteInfo(tc){
  if(!tc.corte)return null;
  const next=nextDay(+tc.corte),last=dayIn(next.getFullYear(),next.getMonth()-1,+tc.corte);
  const per=active().filter(m=>m.medio===tc.nombre&&m.fecha>iso(last)&&m.fecha<=iso(next));
  const compras=per.filter(m=>m.tipo==='gasto').reduce((a,m)=>a+(+m.monto||0),0);
  const pagos=per.filter(m=>m.tipo==='pago_tc').reduce((a,m)=>a+(+m.monto||0),0);

function insights(){

  if(big&&t.gas&&big.monto/t.gas>=.15)out.push(`🧾 El gasto más grande del ciclo: <b>${esc(big.descripcion||big.categoria)}</b> por ${money(big.monto)} (${Math.round(big.monto/t.gas*100)}% del total).`);
  if(isCur&&left>0&&t.ing){const fij=recPend(c).filter(x=>x.r.tipo==='gasto'||x.r.tipo==='ahorro').reduce((a,x)=>a+(+x.r.monto||0),0);const disp=t.disp-fij;
    out.push(disp>0?`💵 Descontando los pagos fijos pendientes${fij?' ('+money(fij)+')':''}, pueden gastar ≈<b>${money(disp/left)} por día</b> durante los ${left} días que quedan.`
      :`🚨 Con los pagos fijos pendientes${fij?' ('+money(fij)+')':''}, el ciclo cerraría en <b>${money(disp)}</b>. Conviene frenar gastos no esenciales.`)}
  if(t.ing&&t.ahorroNeto<=0&&isCur)out.push('🐷 Todavía no registran ahorro en este ciclo. Separar aunque sea el 5% apenas llegue el salario hace la diferencia.');
  return out}
function insightsCard(max){const I=insights();if(!I.length)return'';

  const sub=[m.tercero,m.tipo==='ahorro'||m.tipo==='retiro'?m.fondo:m.categoria,m.medio&&m.tipo!=='ahorro'&&m.tipo!=='retiro'?m.medio:'',+m.cuotas>1?m.cuotas+' cuotas':''].filter(Boolean).join(' · ');

function listByDay(list){
  if(!list.length)return'<div class="empty">No hay movimientos aquí todavía.<br>Toca <b>+</b> para agregar uno.</div>';
  const g={};list.sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.creado||0)-(a.creado||0)).forEach(m=>(g[m.fecha]=g[m.fecha]||[]).push(m));
  return Object.keys(g).map(f=>{const d=parse(f);
    return`<div class="day">${d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'short'})}</div><div class="card list" style="padding:4px 12px">${g[f].map(itemHTML).join('')}</div>`}).join('');

function barRow(label,val,max,color,extra=''){const p=max>0?Math.min(100,val/max*100):0;
  return`<div class="brow"><div class="l"><span>${label}</span><span>${extra||money(val)}</span></div><div class="bar"><i style="width:${p}%;background:${color}"></i></div></div>`}

function srvBanner(){return local.serverViejo?`<div class="alert bad">⚠️ <b>El servidor de Google Sheets está desactualizado.</b> Los datos de la casa (inquilinos, préstamos, efectivo/cuenta) no le llegan completos al otro celular. Actualiza el código de Apps Script y publica una <b>Nueva versión</b>. Cuando lo hagas, la app reenvía todo sola.</div>`:''}
function reenviarTodo(){if(!confirm('¿Reenviar todos los movimientos de este celular a la Google Sheet? Úsalo si el otro celular no ve la misma información.'))return;
  for(const m of movs)if(!pending.includes(m.id))pending.push(m.id);configDirty=true;config.updatedAt=Date.now();persist();sync(true)}
function vInicio(){

  // alertas

    if(p>=1)al.push(`<div class="alert bad">⛔ <b>${esc(cat)}</b>: se pasaron del presupuesto (${money(v)} de ${money(top)})</div>`);
    else if(p>=.8)al.push(`<div class="alert">⚠️ <b>${esc(cat)}</b>: vas en ${Math.round(p*100)}% del presupuesto</div>`)}
  if(cycleOff===0)for(const tc of config.tarjetas){const ci=corteInfo(tc);if(!ci)continue;

    const dc=days(today(),ci.next);if(dc<=3)al.push(`<div class="alert">✂️ Corte <b>${esc(tc.nombre)}</b> ${dc===0?'hoy':dc===1?'mañana':'en '+dc+' días'}: mejor aplazar compras grandes hasta después del corte</div>`);
    if(+tc.meta&&dc<=7&&ci.compras<+tc.meta)al.push(`<div class="alert">🎯 <b>${esc(tc.nombre)}</b>: faltan ${money(tc.meta-ci.compras)} para la meta antes del corte</div>`)}

  if(NEM()&&cycleOff===0){const A=arrStatus(),cj=nemCaja();

    <div class="stat"><span class="small muted">Arriendo por cobrar</span><b class="${A.porCobrar>0?'warn':'ing'}">${A.porCobrar>0?money(A.porCobrar):'Al día ✓'}</b></div></div></div>`}
  const me=prestSaldos('hogar');if(me.total>0)h+=`<div class="card" onclick="go('nemesis')"><h2>🤝 Les deben (préstamos del hogar) <span class="warn">${money(me.total)}</span></h2><div class="small">${me.list.map(([p,v])=>esc(p)+': '+money(v)).join(' · ')}</div></div>`;

function vResumen(){

  // Pie por persona
  const pers=config.personas.map(p=>[p,t.per[p]||0]);let acc=0;
  const stops=t.gas?pers.map(([p,v])=>{const a=acc;acc+=v/t.gas*360;return`${PCOL[p]} ${a}deg ${acc}deg`}).join(','):'var(--ln) 0 360deg';
  h+=`<div class="card"><h2>Gastos por persona</h2><div class="row" style="gap:18px"><div class="pie" style="background:conic-gradient(${stops})"></div>
  <div class="legend">${pers.map(([p,v])=>`<div><i style="background:${PCOL[p]}"></i>${esc(p)}: <b>${money(v)}</b> <span class="muted">${t.gas?Math.round(v/t.gas*100):0}%</span></div>`).join('')}</div></div></div>`;
  // Por categoría vs presupuesto
  const max=Math.max(1,...cats.map(x=>x[1]));
  h+=`<div class="card"><h2>Gastos por categoría <span class="small muted">${money(t.gas)}</span></h2>${cats.length?cats.map(([k,v],i)=>{const top=+config.presupuestos[k]||0;
    const col=top?(v>top?'var(--gas)':v>=.8*top?'var(--warn)':'var(--ing)'):PAL[i%PAL.length];
    return barRow(esc(k),v,top||max,col,top?money(v)+' / '+money(top):money(v))}).join(''):'<div class="empty">Sin gastos en este ciclo</div>'}
  ${totPres?`<hr><div class="small muted">Presupuesto total: ${money(totPres)} · Usado: ${Math.round(pres.reduce((a,[k])=>a+(t.cat[k]||0),0)/totPres*100)}%</div>`:''}</div>`;
  // Tasa de ahorro
  const tasa=t.ing?Math.round(t.ahorroNeto/t.ing*100):0;
  h+=`<div class="card"><h2>Salud financiera del ciclo</h2>
  ${barRow('Tasa de ahorro (meta sugerida 10–20%)',Math.max(0,tasa),30,tasa>=10?'var(--ing)':'var(--warn)',tasa+'%')}
  ${barRow('Gastos sobre ingresos',t.gas,t.ing||t.gas||1,t.gas>t.ing?'var(--gas)':'var(--pri)',t.ing?Math.round(t.gas/t.ing*100)+'%':'—')}
  <div class="small muted">Pagos a tarjetas en el ciclo: ${money(t.pago)} (no se suman como gasto para no contar doble)</div></div>`;
  // Últimos 6 ciclos
  const hist=[];for(let i=5;i>=0;i--){const cc=cycleAt(cycleOff-i);const tt=totals(inCycle(cc));hist.push([cc,tt])}
  const hm=Math.max(1,...hist.map(([,x])=>Math.max(x.ing,x.gas)));
  h+=`<div class="card"><h2>Últimos 6 ciclos</h2><div class="vbars">${hist.map(([cc,x])=>`<div class="g"><div class="pair">
  <i style="height:${x.ing/hm*100}%;background:var(--ing)"></i><i style="height:${x.gas/hm*100}%;background:var(--gas)"></i></div>
  <small>${MES[cc.e.getMonth()]}</small></div>`).join('')}</div>
  <div class="legend row" style="gap:14px;margin-top:6px"><div><i style="background:var(--ing)"></i>Ingresos</div><div><i style="background:var(--gas)"></i>Gastos</div></div></div>`;
  h+=`<button class="btn" style="width:100%" onclick="exportCSV(true)">⬇️ Descargar este ciclo (CSV para Excel)</button>`;
  return h;
}

/* ---- Deuda por tarjeta: saldo según el banco + compras − pagos registrados después ---- */
function deuda(tc){if(tc.saldo===undefined||tc.saldo===null||tc.saldo==='')return null;const ts=+tc.saldoTs||0;
  return active().filter(m=>m.medio===tc.nombre&&(+m.creado||0)>ts).reduce((a,m)=>a+(m.tipo==='gasto'?1:m.tipo==='pago_tc'?-1:0)*(+m.monto||0),+tc.saldo||0)}
function deudaTotal(){const r={total:0,per:{},n:0};for(const tc of config.tarjetas){const d=deuda(tc);if(d===null)continue;r.n++;r.total+=d;r.per[tc.titular]=(r.per[tc.titular]||0)+d}return r}
function openSaldo(i){const tc=config.tarjetas[i];if(!tc)return;const d=deuda(tc);
  $('#sheetBody').innerHTML=`<div class="row sp"><h2 style="margin:0;font-size:18px">💳 ${esc(tc.nombre)}</h2><button class="btn sm" onclick="closeForm()">✕</button></div>
  <div class="small muted" style="margin-top:8px">Escribe la <b>deuda total</b> que muestra hoy la app del banco: el saldo total, no el pago mínimo. Desde ahí, la app suma las compras y resta los pagos que registren.</div>
  <label>Deuda actual según el banco</label><input id="sSaldo" class="money" inputmode="numeric" placeholder="$0" value="${d!==null?fmtN.format(Math.max(0,Math.round(d))):''}" oninput="fmtInput(this)">
  ${d!==null?`<div class="small muted" style="margin-top:6px">Saldo que calcula la app ahora: ${money(d)}. Si el banco muestra otro valor, escribe el del banco: ese es el correcto.</div>`:''}
  <div class="btns">${d!==null?`<button class="btn del" onclick="setSaldo(${i},null)">Quitar</button>`:''}<button class="btn pri" onclick="setSaldo(${i},num($('#sSaldo').value))">Guardar</button></div>`;
  $('#sheet').classList.remove('hidden');setTimeout(()=>{const x=$('#sSaldo');x&&x.focus()},150)}
function setSaldo(i,v){const tc=config.tarjetas[i];if(!tc)return;
  if(v===null){delete tc.saldo;delete tc.saldoTs;delete tc.saldoFecha}else{tc.saldo=v;tc.saldoTs=Date.now();tc.saldoFecha=iso(today())}
  touchConfig();closeForm();toast(v===null?'Deuda quitada':'Deuda actualizada ✓');render()}
function deudaCard(){const D=deudaTotal();if(!D.n)return'';

function mesesHasta(ym){if(!ym)return 0;const[y,m]=ym.split('-').map(Number),t=today();return Math.max(1,(y-t.getFullYear())*12+(m-1-t.getMonth()))}
function fondoCard(f,caja){const s=fondoSaldo(f.nombre),meta=+f.meta||0,ms=mesesHasta(f.fecha),falta=meta-s;
  const sug=meta&&falta>0?(ms?`Faltan ${money(falta)}. Para tenerlo en ${MES[+f.fecha.slice(5)-1]} ${f.fecha.slice(0,4)} hay que guardar <b>${money(falta/ms)} al mes</b> (${ms} ${ms>1?'meses':'mes'}).`:`Faltan ${money(falta)}. Guardando ${money(falta/12)} al mes lo completan en 12 meses.`):'';
  return`<div class="card"><h2>🐷 ${esc(f.nombre)}${f.fecha?` <span class="small muted">para ${MES[+f.fecha.slice(5)-1]} ${f.fecha.slice(0,4)}</span>`:''}</h2>${meta?barRow('Avance',s,meta,'var(--aho)',money(s)+' / '+money(meta)):`<div class="big aho" style="font-size:22px">${money(s)}</div><div class="small muted">Sin meta definida (agrégala en Ajustes)</div>`}
  ${sug?`<div class="small muted">${sug}</div>`:meta&&s>=meta?'<div class="small ing">Meta cumplida ✓</div>':''}
  <div class="btns"><button class="btn" onclick="openForm(null,${js({tipo:'ahorro',fondo:f.nombre,caja})})">+ Abonar</button><button class="btn" onclick="openForm(null,${js({tipo:'retiro',fondo:f.nombre,caja})})">− ${caja?'Usar / retirar':'Retirar'}</button></div></div>`}
function fondoSaldo(n){return active().filter(m=>m.fondo===n).reduce((a,m)=>a+(m.tipo==='ahorro'?1:m.tipo==='retiro'?-1:0)*(+m.monto||0),0)}
function promGastos(){const v=[];for(let i=1;i<=3;i++){const t=totals(inCycle(cycleAt(-i)));if(t.gas)v.push(t.gas)}
  if(!v.length){const t=totals(inCycle(cycleAt(0)));if(t.gas)v.push(t.gas)}return v.length?v.reduce((a,b)=>a+b,0)/v.length:0}
/* ================== Casa en arriendo (Némesis) ================== */
const CTA=()=>(config.nemesis&&config.nemesis.cuenta)||'Cuenta';
const esEf=m=>m.medio==='Efectivo';
function nemCajas(){const N=config.nemesis||{},B=N.cajaBase||{efectivo:+N.saldoInicial||0,cuenta:0,ts:0},r={efectivo:+B.efectivo||0,cuenta:+B.cuenta||0};
  for(const m of nemAct()){if(m.tipo==='pago_tc'||(+m.creado||0)<=(+B.ts||0))continue;const v=+m.monto||0;
    if(m.tipo==='traslado'){if(esEf(m)){r.efectivo+=v;r.cuenta-=v}else{r.cuenta+=v;r.efectivo-=v}continue}
    const sg=TIPOS[m.tipo]?.s||0;if(esEf(m))r.efectivo+=sg*v;else r.cuenta+=sg*v}
  r.total=r.efectivo+r.cuenta;return r}

function renameRefs(field,oldN,newN){if(!oldN||!newN||oldN===newN)return;const now=Date.now();
  for(const m of movs)if(m[field]===oldN){m[field]=newN;m.actualizado=now;if(!pending.includes(m.id))pending.push(m.id)}

function saveCfg(){

    el.querySelectorAll('[data-k]').forEach(i=>r[i.dataset.k]=i.dataset.k==='monto'?num(i.value):i.dataset.k==='dia'?Math.min(31,Math.max(1,+i.value||1)):i.value.trim());return r}).filter(r=>r.id&&r.nombre);
  config.tarjetas.forEach((t,i)=>renameRefs('medio',oldT[i],t.nombre));config.fondos.forEach((f,i)=>renameRefs('fondo',oldF[i],f.nombre));

function collect(){const g=s=>{const e=$(s);return e?e.value:undefined};

function setF(k,v){collect();fm[k]=v;

  if(k==='caja'&&v!=='nemesis'&&(fm.medio===CTA()))fm.medio='Efectivo';

  if(k==='tipo'){if(v==='pago_tc'&&!esTarjeta(fm.medio))fm.medio=config.tarjetas[0]?.nombre||'';
    if((v==='ahorro'||v==='retiro')&&!fm.fondo)fm.fondo=fondosFor(fm.caja||'hogar')[0]?.nombre||'';
    const cats=catsFor(v,fm.caja);if(!cats.includes(fm.categoria))fm.categoria=''}
  if(k==='caja'){if(!catsFor(fm.tipo,v).includes(fm.categoria))fm.categoria='';const F=fondosFor(v||'hogar');if(!F.some(f=>f.nombre===fm.fondo))fm.fondo=F[0]?.nombre||''}
  drawForm()}

function saveMov(){collect();const m=fm;
  if(!(m.monto>0))return toast('Escribe el monto');

  if(m.tipo==='pago_tc'&&!m.medio)return toast('Agrega tus tarjetas en Ajustes');

  if(m.caja==='nemesis'){if(m.medio!=='Efectivo')m.medio=CTA()}

  if(m.tipo!=='ahorro'&&m.tipo!=='retiro')m.fondo='';
  if(!['gasto','ingreso'].includes(m.tipo))m.categoria='';
  if(fmNew){const dup=active().find(x=>x.tipo===m.tipo&&+x.monto===m.monto&&x.fecha===m.fecha&&x.persona===m.persona);
    if(dup&&!confirm('Ya hay un movimiento igual ese día ('+money(m.monto)+' · '+(dup.descripcion||dup.categoria||dup.fondo)+'). ¿Guardarlo de todas formas?'))return}
  if(m._rep&&!m.rec){const r={id:uid(),nombre:m.descripcion||m.categoria||m.fondo||TIPOS[m.tipo].n,tipo:m.tipo,monto:m.monto,persona:m.persona,
    categoria:m.categoria,medio:m.medio,fondo:m.fondo,dia:parse(m.fecha).getDate(),caja:m.caja==='nemesis'?'nemesis':'hogar'};config.recurrentes=[...(config.recurrentes||[]),r];m.rec=r.id;touchConfig()}
  delete m._rep;
  const now=Date.now();m.creado=m.creado||now;m.actualizado=now;m.autor=local.yo;m.borrado=false;
  upsertLocal(m);closeForm();toast(fmNew?'Guardado ✓':'Actualizado ✓');render();
}
function delMov(){if(!confirm('¿Eliminar este movimiento?'))return;const m={...fm,borrado:true,actualizado:Date.now(),autor:local.yo};upsertLocal(m);closeForm();toast('Eliminado');render()}

/* ================== Sincronización ================== */
let syncing=false,syncTimer=null,syncAgain=false;
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(false),1000)}
function updDot(){const d=$('#syncDot');d.className='dot '+(syncing?'run':!local.url?'':(pending.length||configDirty)?'pend':'ok')}
function norm(s){return{id:String(s.id),fecha:String(s.fecha).slice(0,10),tipo:s.tipo||'gasto',monto:+s.monto||0,persona:s.persona||'Compartido',
  categoria:s.categoria||'',medio:s.medio||'',cuotas:+s.cuotas||1,fondo:s.fondo||'',descripcion:s.descripcion||'',autor:s.autor||'',
  rec:s.rec?String(s.rec):'',caja:s.caja==='nemesis'?'nemesis':'',tercero:s.tercero?String(s.tercero):'',creado:+s.creado||0,actualizado:+s.actualizado||0,borrado:s.borrado===true||String(s.borrado).toUpperCase()==='TRUE'}}
async function sync(manual){
  if(!local.url||!local.token){updDot();if(manual)toast('Configura la conexión en Ajustes ⚙');return}
  if(syncing){syncAgain=true;return}
  if(!navigator.onLine){if(manual)toast('Sin internet: se sincroniza al volver la conexión');return}
  syncing=true;updDot();
  try{
    const ids=[...pending],items=movs.filter(m=>ids.includes(m.id));
    const sendCfg=configDirty&&local.lastSync>0,sentCfg=sendCfg?config.updatedAt:null; // nunca enviar config antes de recibir la del servidor
    const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),25000);
    let r;try{r=await fetch(local.url,{method:'POST',body:JSON.stringify({token:local.token,action:'sync',items,config:sendCfg?config:null}),signal:ctl.signal})}
    catch(e){throw new Error(e.name==='AbortError'?'la conexión tardó demasiado':'sin conexión con Google')}finally{clearTimeout(tm)}
    if(!r.ok)throw new Error('servidor respondió '+r.status);
    let j;try{j=await r.json()}catch(e){throw new Error('respuesta inválida: revisa la URL (debe terminar en /exec)')}
    if(!j.ok)throw new Error(j.error||'Error del servidor');
    const sentAt=new Map(items.map(x=>[x.id,x.actualizado]));
    pending=pending.filter(id=>{if(!sentAt.has(id))return true;const cur=movs.find(m=>m.id===id);return cur&&cur.actualizado!==sentAt.get(id)});
    if(sentCfg!==null&&config.updatedAt===sentCfg)configDirty=false;
    const map=new Map(movs.map(m=>[m.id,m]));
    local.srv=+j.v||1;
    const srvNuevo=!(j.items||[]).length||('caja' in j.items[0]);
    if(!srvNuevo)local.serverViejo=true;
    else if(local.serverViejo){local.serverViejo=false;for(const m of movs)if((m.caja||m.tercero)&&!pending.includes(m.id))pending.push(m.id);setTimeout(()=>{toast('Servidor actualizado: reenviando los datos de la casa…');scheduleSync()},500)}
    for(const s0 of j.items||[]){const s=norm(s0),l=map.get(s.id);if(l)for(const k of['caja','tercero'])if(!(k in s0))s[k]=l[k]||'';if(!l||(!pending.includes(s.id)&&s.actualizado>=(+l.actualizado||0)))map.set(s.id,s)}
    movs=[...map.values()];
    if(j.config&&(!local.lastSync||((+j.config.updatedAt||0)>(+config.updatedAt||0)&&!configDirty))){
      if(!local.lastSync&&configDirty&&(+j.config.updatedAt||0)>1)toast('Se cargó la configuración compartida de la Google Sheet');
      config=Object.assign({},DEFAULT_CONFIG,j.config);configDirty=false;migrar()}
    local.lastSync=Date.now();persist();
    if(tab!=='ajustes'||manual)render();
    if(manual)toast('Sincronizado ✓');
  }catch(e){if(manual)toast('No se pudo sincronizar: '+e.message)}
  finally{syncing=false;updDot();if(syncAgain){syncAgain=false;scheduleSync()}}
}

/* ================== Exportar / importar ================== */
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportCSV(ciclo){
  let L=active();let name='finanzas-todo.csv';
  if(ciclo){const c=cycleAt(cycleOff);L=inCycle(c);name='finanzas-'+c.si+'_'+c.ei+'.csv'}
  const H=['Fecha','Caja','Tipo','Monto','Persona','Categoría','Medio','Cuotas','Fondo','Tercero','Descripción','Registró'];
  const q=v=>{let x=String(v??'');if(/^[=+\-@]/.test(x)&&isNaN(+x))x="'"+x;return'"'+x.replace(/"/g,'""')+'"'};
  const rows=L.sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(m=>[m.fecha,isN(m)?NN():'Hogar',TIPOS[m.tipo]?.n||m.tipo,m.monto,m.persona,m.categoria,m.medio,m.cuotas,m.fondo,m.tercero,m.descripcion,m.autor].map(q).join(';'));
  download(name,'﻿'+[H.map(q).join(';'),...rows].join('\r\n'),'text/csv;charset=utf-8');
}
function borrarTodo(){const L=active();if(!L.length)return toast('No hay movimientos');
  if(!confirm('¿Borrar los '+L.length+' movimientos? Se borran también en la Google Sheet y en el otro celular. Las tarjetas, fondos y ajustes se conservan.'))return;
  if(!confirm('¿Seguro? Esta acción no se puede deshacer desde la app.'))return;
  const now=Date.now();for(const m of L){m.borrado=true;m.actualizado=now;m.autor=local.yo;if(!pending.includes(m.id))pending.push(m.id)}
  persist();scheduleSync();toast('Movimientos borrados');render()}
function exportJSON(){download('respaldo-finanzas-'+iso(today())+'.json',JSON.stringify({v:1,movs,config},null,1),'application/json')}
function importJSON(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.movs))throw 0;
  if(!confirm('Se restaurarán '+d.movs.length+' movimientos (se conserva la versión más reciente de cada uno). ¿Continuar?'))return;
  const map=new Map(movs.map(m=>[m.id,m]));d.movs.filter(m=>m&&m.id).forEach(m=>{const n=norm(m),l=map.get(n.id);if(!l||n.actualizado>(+l.actualizado||0)){map.set(n.id,n);if(!pending.includes(n.id))pending.push(n.id)}});movs=[...map.values()];
  if(d.config){config=Object.assign({},DEFAULT_CONFIG,d.config);config.updatedAt=Date.now();configDirty=true}
  persist();toast('Copia restaurada ✓');render();scheduleSync()}catch(e){toast('Archivo no válido')}};r.readAsText(f)}

/* ================== Navegación ================== */
const VIEWS={inicio:['Inicio',vInicio],movs:['Movimientos',vMovs],resumen:['Resumen',vResumen],tarjetas:['Tarjetas',vTarjetas],ahorro:['Ahorro',vAhorro],nemesis:['Casa en arriendo',vNemesis],ajustes:['Ajustes',vAjustes]};
function go(t){tab=t;if(!['movs','resumen','inicio','nemesis'].includes(t))cycleOff=0;render();window.scrollTo(0,0)}
function render(){const[t,f]=VIEWS[tab];$('#title').textContent=tab==='nemesis'?NN():t;
  $('#tabNem').style.display=NEM()?'':'none';$('#view').innerHTML=f();
  if($('#qIn')){$('#qIn').value=window._qText||'';$('#qIn').oninput=e=>window._qText=e.target.value;drawQuick()}
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('#fab').style.display=tab==='ajustes'?'none':'';updDot()}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
$('#cfgBtn').onclick=()=>go('ajustes');
$('#syncBtn').onclick=()=>sync(true);
$('#fab').onclick=()=>openForm(null,tab==='ahorro'?{tipo:'ahorro'}:tab==='nemesis'?{caja:'nemesis'}:null);
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeForm()});
window.addEventListener('online',()=>sync(false));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync(false)});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
migrar();render();sync(false);
if(!LS.get('local',null)?.yoSet){$('#sheetBody').innerHTML=`<h2 style="margin:0 0 6px">👋 ¡Bienvenidos!</h2><div class="muted">¿Quién usa este celular? Así cada registro queda a nombre de la persona correcta.</div>
  <div class="btns">${config.personas.filter(p=>p!=='Compartido').map(p=>`<button class="btn pri" onclick="local.yo=${js(p)};local.yoSet=true;persist();closeForm();render()">${esc(p)}</button>`).join('')}</div>`;$('#sheet').classList.remove('hidden')}
(function(){const P=new URLSearchParams(location.search);if(![...P.keys()].length)return;history.replaceState(null,'',location.pathname);
  const q=[P.get('q'),P.get('t')].filter(Boolean).join(' ').trim();
  if(q){tab='inicio';cycleOff=0;render();window._qText=q;$('#qIn').value=q;quickParse()}
  else if(P.get('add'))openForm(null,{tipo:P.get('add')});
  else if(P.get('voz')){tab='inicio';cycleOff=0;render();setTimeout(()=>{$('#qIn').focus();try{dictar()}catch(e){}},300)}})();
</script>
